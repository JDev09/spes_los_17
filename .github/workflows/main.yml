name: Build Xiaomi Spes kernel

on:
  push:
    branches: [prebuilt]
  pull_request:
    branches: [prebuilt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            python3

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- stock_defconfig
          scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/vendor/xiaomi/spes.config
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel and modules
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" Image.gz modules
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/out/modules" modules_install

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spes-kernel-${{ github.sha }}
          if-no-files-found: error
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/System.map
            out/vmlinux
            out/modules/lib/modules/**
